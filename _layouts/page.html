---
layout: default
---
<article class="page">
  <header class="grid page-head">
    <p class="label">{{ page.label | default: 'Page' }}</p>
    <h1 class="display">{{ page.title }}</h1>
  </header>
  <div class="grid">
    <div class="content{% if page.full %} full{% else %} wide{% endif %}">
      {{ content }}
    </div>
  </div>
</article>
